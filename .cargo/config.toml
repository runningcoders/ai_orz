# 项目级 cargo 配置（仅作用于本仓库，随 git 提交对全队生效）

[target.wasm32-unknown-unknown]
# 前端 WASM 链接不需要 lld，保持默认链接器
linker = "rust-lld"

[build]
# 限制并发编译进程数，避免内存被打爆（M 系列芯片日常开发 8 足够）
jobs = 8

# target/ 磁盘治理：Cargo 只会回收 ~/.cargo 全局缓存（[cache] auto-clean-frequency），
# target 目录里的 build artifacts GC 官方尚未实现（Cargo Book "Global caches" / cargo#13136），
# 旧指纹副本会无限累积。因此所有编译入口在编译前自动跑 scripts/clean_target.sh stale
# （按 .fingerprint/*/invoked.timestamp 精准判定活缓存），命令结束后再由各脚本的 EXIT trap
# 立刻清掉本次产生的 *.rcgu.o（common.sh::clean_generated_rcgu，编完即回落）；
# 手动深度瘦身 make clean-slim，全量重置 make clean。
# 可用 AI_ORZ_GC_KEEP_DAYS / AI_ORZ_GC_KEEP_PER_CRATE 调保留窗口。
