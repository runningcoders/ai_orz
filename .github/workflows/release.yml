name: Release

# 打 tag（v*）自动触发构建发布产物；也支持手动触发用于提前验证
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  CARGO_INCREMENTAL: 0
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai_orz

jobs:
  # ===== 按平台原生构建（不做交叉编译：lancedb/ort-sys 交叉编译链太重）=====
  # 产物 = 后端二进制 + dist/ 前端静态资源（migrations 与默认配置均已内嵌二进制）
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5

    # libprotobuf-dev 提供 well-known types（google/protobuf/*.proto），
    # --no-install-recommends 下必须显式安装，否则 lance-encoding build script 报 empty.proto not found
    - name: Install protoc (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

    - name: Install protoc (macOS)
      if: runner.os == 'macOS'
      run: brew install protobuf

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    - name: Configure sccache (local disk mode)
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

    # release profile 与 CI lint/test 的 dev profile RUSTFLAGS 不同，
    # sccache 按内容寻址仍可命中依赖库的 release 编译产物
    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/sccache
        key: sccache-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-release-${{ runner.os }}-
          sccache-${{ runner.os }}-

    - name: Cache ort-sys prebuilt binaries
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/ort
          ~/Library/Caches/ort
        key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ort-sys-${{ runner.os }}-

    - name: Start sccache server
      run: sccache --start-server || true

    # dioxus-cli 版本与 frontend Cargo.toml 的 dioxus 0.7.x 对齐
    - name: Install dioxus-cli (dx)
      run: |
        curl -fsSL https://dioxuslabs.com/install.sh | bash
        echo "$HOME/.dioxus/bin" >> $GITHUB_PATH
        dx --version

    # 复用本地打包链路：scripts/package.sh 内部完成 前端 dx build --release → dist/ → 后端 cargo build --release → 组装 tar.gz
    # 打包逻辑与本地 make package 完全一致（单一事实源）
    - name: Build & package release (frontend + backend + tar.gz)
      shell: bash
      env:
        # 事件字段经 env 传入 shell，不直接在 run 中插值（防注入）
        REF_NAME: ${{ github.ref_name }}
      run: ./scripts/package.sh "${REF_NAME:-manual}"

    - name: Upload build artifact
      uses: actions/upload-artifact@v5
      with:
        name: ai_orz-${{ github.ref_name || 'manual' }}-${{ matrix.target }}
        path: ai_orz-*.tar.gz
        retention-days: 30

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats || true

    - name: Stop sccache server
      if: always()
      run: sccache --stop-server || true

  # ===== 容器镜像：amd64 / arm64 原生 runner 各构建一次，再合并多架构 manifest =====
  # 不用 QEMU 模拟：duckdb 的 bundled C++ 源码编译 + fastembed 下载 ONNX Runtime 二进制，
  # 模拟构建慢且易失败。原生 runner 与上面 release job「不做交叉编译」的既定口径一致
  # （Dockerfile 内也写明了这一点，改这里请同步注释）。
  docker:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 按 digest 推送（不打 tag）：多架构 manifest 由 docker-merge 统一创建，
    # 避免两个架构互相覆盖同一个 tag
    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: ${{ matrix.platform }}
        provenance: false
        outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=docker-${{ matrix.platform }}
        cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform }}

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v5
      with:
        name: digests-${{ strategy.job-index }}
        path: /tmp/digests/*
        retention-days: 1

  # ===== 合并多架构 manifest 并打 tag =====
  docker-merge:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Download digests
      uses: actions/download-artifact@v6
      with:
        pattern: digests-*
        path: /tmp/digests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # tag 事件 → 版本号 + latest；手动触发 → sha-短摘要（避免污染 latest）
    - name: Create multi-arch manifest
      env:
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
        IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [ "$IS_TAG" = "true" ]; then
          tags=("${REF_NAME#v}" "latest")
        else
          tags=("sha-${SHA:0:7}")
        fi
        refs=()
        for d in $(find /tmp/digests -type f -printf '%f\n' | sort); do
          refs+=("$IMAGE_NAME@sha256:$d")
        done
        echo "合并 ${#refs[@]} 个架构镜像: ${refs[*]}"
        for tag in "${tags[@]}"; do
          docker buildx imagetools create -t "$IMAGE_NAME:$tag" "${refs[@]}"
        done

  # ===== 发布到 GitHub Release（仅 tag 触发时执行）=====
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v6
      with:
        pattern: ai_orz-*
        path: release-assets/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: release-assets/**/*.tar.gz
