name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  # ===== 1. Lint 门禁（快，先跑）=====
  # fmt + clippy，clippy --all-targets 会编译 lance build-script，需要 protoc
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.6

    - name: Install rustfmt and clippy
      run: rustup component add rustfmt clippy

    - name: Configure sccache
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy check (deny warnings)
      run: cargo clippy --all-targets -- -D warnings

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats

  # ===== 2. Backend（lint 通过后跑）=====
  # check + build + 单元测试 + 集成测试
  # sccache 命中 lint job 的依赖编译产物，加速编译
  backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4

    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.6

    - name: Configure sccache
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

    - name: Cache ort-sys prebuilt binaries
      uses: actions/cache@v4
      with:
        path: ~/.cache/ort
        key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ort-sys-${{ runner.os }}-

    - name: Check backend
      run: cargo check --lib --verbose

    - name: Build
      run: cargo build --verbose

    - name: Run unit tests (parallel)
      run: cargo test --lib --verbose

    - name: Run integration tests (parallel)
      run: cargo test --test '*' --verbose

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats

  # ===== 3. Frontend（lint 通过后跑，与 backend 并行）=====
  # wasm32 check + 前端测试，独立于 backend
  frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4

    - name: Install wasm32 target
      run: rustup target add wasm32-unknown-unknown

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.6

    - name: Configure sccache
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

    - name: Check frontend
      run: cd frontend && cargo check --target wasm32-unknown-unknown --verbose

    - name: Run frontend tests
      run: cd frontend && cargo test --verbose

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats

  # ===== 4. Coverage（backend 通过后跑）=====
  # tarpaulin 覆盖率报告，最慢最易失败，放最后
  # sccache 命中 backend job 的依赖编译产物（非 instrument-coverage 部分），
  # 减少依赖库编译时间；instrument-coverage 部分仍需重编
  coverage:
    runs-on: ubuntu-latest
    needs: backend
    steps:
    - uses: actions/checkout@v4

    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.6

    - name: Install cargo-tarpaulin
      run: cargo install --locked cargo-tarpaulin || true

    - name: Configure sccache
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

    - name: Cache ort-sys prebuilt binaries
      uses: actions/cache@v4
      with:
        path: ~/.cache/ort
        key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ort-sys-${{ runner.os }}-

    # Tarpaulin 主要支持 Linux，这里 runs-on 已是 ubuntu-latest。
    # Baseline: 40.79% (6560/16083 lines, 2026-07-27 实测，不带 --all-features)
    # 门槛设为 35%，留 ~5% 缓冲避免小幅波动误报。
    # 注意：--lib 是 tarpaulin 自己的 flag（只测 lib target），
    #       不能写成 `-- --lib`（那是传给 test binary 的，会报 Unrecognized option）
    - name: Generate coverage report
      run: |
        cargo tarpaulin --workspace --lib --exclude frontend --out Xml --out Html \
          --output-dir ./coverage \
          --exclude-files "tests/common/*" \
          --fail-under 35

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage/
