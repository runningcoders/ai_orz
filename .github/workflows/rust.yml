name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  # sccache 与 incremental compilation 互斥，禁用 incremental 让 sccache 完全接管缓存
  # sccache 按内容寻址，相同 RUSTFLAGS 的编译结果跨 CI run 共享
  CARGO_INCREMENTAL: 0

jobs:
  # ===== 1. Lint 门禁（快，先跑）=====
  # fmt + clippy，clippy --all-targets 会编译 lance build-script，需要 protoc
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    - name: Install rustfmt and clippy
      run: rustup component add rustfmt clippy

    - name: Configure sccache (local disk mode)
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

    # 所有 job 共享同一个 sccache 缓存，按内容寻址跨 job 复用编译产物
    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Start sccache server
      run: sccache --start-server || true

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy check (deny warnings)
      run: cargo clippy --all-targets -- -D warnings

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats || true

    - name: Stop sccache server
      if: always()
      run: sccache --stop-server || true

  # ===== 2. Backend（lint 通过后跑）=====
  # build + 单元测试 + 集成测试
  # sccache 命中 lint job 的依赖编译产物，加速编译
  # 注：去掉 cargo check --lib，build 已包含类型检查
  backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v5

    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    - name: Configure sccache (local disk mode)
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

    - name: Cache ort-sys prebuilt binaries
      uses: actions/cache@v5
      with:
        path: ~/.cache/ort
        key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ort-sys-${{ runner.os }}-

    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Start sccache server
      run: sccache --start-server || true

    - name: Build
      run: cargo build --verbose

    - name: Run unit tests (parallel)
      run: cargo test --lib --verbose

    - name: Run integration tests (parallel)
      run: cargo test --test '*' --verbose

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats || true

    - name: Stop sccache server
      if: always()
      run: sccache --stop-server || true

  # ===== 3. Frontend（lint 通过后跑，与 backend 并行）=====
  # wasm32 check + 前端测试，独立于 backend
  frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v5

    - name: Install wasm32 target and clippy
      run: rustup target add wasm32-unknown-unknown && rustup component add clippy

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    - name: Configure sccache (local disk mode)
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Start sccache server
      run: sccache --start-server || true

    - name: Check frontend
      run: cd frontend && cargo check --target wasm32-unknown-unknown --verbose

    - name: Clippy check (deny warnings)
      run: cd frontend && cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

    - name: Run frontend tests
      run: cd frontend && cargo test --verbose

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats || true

    - name: Stop sccache server
      if: always()
      run: sccache --stop-server || true

  # ===== 4. Coverage（backend 通过后跑）=====
  # tarpaulin 覆盖率报告，最慢最易失败，放最后
  # sccache 命中 backend job 的依赖编译产物（非 instrument-coverage 部分），
  # 减少依赖库编译时间；instrument-coverage 部分仍需重编
  coverage:
    runs-on: ubuntu-latest
    needs: backend
    steps:
    - uses: actions/checkout@v5

    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Configure sccache (local disk mode)
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

    - name: Cache ort-sys prebuilt binaries
      uses: actions/cache@v5
      with:
        path: ~/.cache/ort
        key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ort-sys-${{ runner.os }}-

    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Start sccache server
      run: sccache --start-server || true

    # 用 cargo-llvm-cov 替代 tarpaulin：
    # - 纯 LLVM source-based coverage，不依赖 ptrace，更稳定
    # - --ignore-filename-regex 在报告阶段过滤掉依赖库、测试脚手架、build script
    # - --no-clean 复用编译产物，避免重复 clean
    # - --no-fail-fast 测试失败也继续收集覆盖数据
    # - --fail-under-lines 直接按行覆盖率门槛
    # - --workspace: 主 crate + common + ai-orz-macros + frontend 单元测试全部计入
    # - --tests: 所有 [[test]] 集成测试也一起跑 + 计入覆盖（之前只 --lib 漏掉了 15 个集成测试）
    #
    # 【重要】--html 与 --lcov 参数互斥：
    # - 第一步：跑测试 + 产出 lcov（给 Codecov/脚本消费），同时 fail-under-lines 校验
    # - 第二步：cargo llvm-cov report --no-run，基于已有的 profdata 产出 html（给人 review artifact）
    #   --no-run 避免重复跑测试，直接复用第一步生成的 coverage 数据
    #
    # 关于依赖库重编（LLVM source-based coverage 的固有限制）：
    # -instrument-coverage 是全局 RUSTFLAGS，依赖库也会被 instrument
    # -Cargo 的 per-package profile override 不支持 rustflags 字段（连 nightly 都不支持）
    # -sccache 跨不同 RUSTFLAGS 的 job（backend 普通 vs coverage instrument-coverage）无法共享
    # -但 coverage job 自己跨多次 CI run 可以共享（相同 RUSTFLAGS 的依赖库编译结果缓存）
    # -第一次 coverage job 需重编所有依赖的 instrument-coverage 版本
    # -后续 coverage job sccache 命中，只需编译 workspace 成员
    #
    # 关于 PR vs main 差异化：
    # - push 到 main：严格 fail-under-lines 45（红线）
    # - PR：同一份命令跑但 fail-under-lines 设 38（更低的警告阈值），
    #   用代码块里的条件判断。这样 PR 不会因为覆盖率小跌就硬失败，
    #   但 main 分支必须守住底线。
    - name: Generate coverage report (lcov + fail-under check)
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
          FAIL_UNDER=45
        else
          FAIL_UNDER=38
        fi
        echo "Using fail-under-lines=$FAIL_UNDER for event=${{ github.event_name }} ref=${{ github.ref }}"
        mkdir -p ./coverage
        cargo llvm-cov \
          --workspace \
          --tests \
          --no-clean \
          --no-fail-fast \
          --ignore-filename-regex "(tests/common/|/cargo/registry/|/rustc/|build.rs|target/)" \
          --lcov \
          --output-path ./coverage/lcov.info \
          --fail-under-lines "$FAIL_UNDER"

    - name: Generate coverage report (html artifact)
      run: |
        set -euo pipefail
        cargo llvm-cov report \
          --workspace \
          --no-run \
          --ignore-filename-regex "(tests/common/|/cargo/registry/|/rustc/|build.rs|target/)" \
          --html \
          --output-dir ./coverage

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats || true

    - name: Stop sccache server
      if: always()
      run: sccache --stop-server || true

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v5
      with:
        name: coverage-report
        path: ./coverage/
