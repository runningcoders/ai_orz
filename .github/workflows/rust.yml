name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Cache ort-sys prebuilt binaries
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ort
        key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ort-sys-${{ runner.os }}-

    - name: Cache Cargo build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target/debug/.fingerprint
          target/debug/build
          target/debug/deps
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-

    - name: Check backend
      run: cargo check --lib --verbose

    - name: Install wasm32 target
      run: rustup target add wasm32-unknown-unknown

    - name: Check frontend
      run: cd frontend && cargo check --target wasm32-unknown-unknown --verbose

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose
