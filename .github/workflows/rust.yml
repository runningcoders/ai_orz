name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  # sccache 与 incremental compilation 互斥，禁用 incremental 让 sccache 完全接管缓存
  # sccache 按内容寻址，相同 RUSTFLAGS 的编译结果跨 CI run 共享
  CARGO_INCREMENTAL: 0

jobs:
  # ===== 1. Lint 门禁（快，先跑）=====
  # fmt + clippy，clippy --all-targets 会编译 lance build-script，需要 protoc
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    - name: Install rustfmt and clippy
      run: rustup component add rustfmt clippy

    - name: Configure sccache (local disk mode)
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

    # 所有 job 共享同一个 sccache 缓存，按内容寻址跨 job 复用编译产物
    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Start sccache server
      run: sccache --start-server || true

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy check (deny warnings)
      run: cargo clippy --all-targets -- -D warnings

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats || true

    - name: Stop sccache server
      if: always()
      run: sccache --stop-server || true

  # ===== 2. Backend（lint 通过后跑）=====
  # build + 单元测试 + 集成测试
  # sccache 命中 lint job 的依赖编译产物，加速编译
  # 注：去掉 cargo check --lib，build 已包含类型检查
  backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v5

    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    - name: Configure sccache (local disk mode)
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

    - name: Cache ort-sys prebuilt binaries
      uses: actions/cache@v5
      with:
        path: ~/.cache/ort
        key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ort-sys-${{ runner.os }}-

    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Start sccache server
      run: sccache --start-server || true

    - name: Build
      run: cargo build --verbose

    - name: Run unit tests (parallel)
      run: cargo test --lib --verbose

    - name: Run integration tests (parallel)
      run: cargo test --test '*' --verbose

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats || true

    - name: Stop sccache server
      if: always()
      run: sccache --stop-server || true

  # ===== 3. Frontend（lint 通过后跑，与 backend 并行）=====
  # wasm32 check + 前端测试，独立于 backend
  frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v5

    - name: Install wasm32 target and clippy
      run: rustup target add wasm32-unknown-unknown && rustup component add clippy

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    - name: Configure sccache (local disk mode)
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Start sccache server
      run: sccache --start-server || true

    - name: Check frontend
      run: cd frontend && cargo check --target wasm32-unknown-unknown --verbose

    - name: Clippy check (deny warnings)
      run: cd frontend && cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

    - name: Run frontend tests
      run: cd frontend && cargo test --verbose

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats || true

    - name: Stop sccache server
      if: always()
      run: sccache --stop-server || true

  # ===== 4. Coverage（backend 通过后跑）=====
  # tarpaulin 覆盖率报告，最慢最易失败，放最后
  # sccache 命中 backend job 的依赖编译产物（非 instrument-coverage 部分），
  # 减少依赖库编译时间；instrument-coverage 部分仍需重编
  coverage:
    runs-on: ubuntu-latest
    needs: backend
    steps:
    - uses: actions/checkout@v5

    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Configure sccache (local disk mode)
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

    - name: Cache ort-sys prebuilt binaries
      uses: actions/cache@v5
      with:
        path: ~/.cache/ort
        key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ort-sys-${{ runner.os }}-

    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Start sccache server
      run: sccache --start-server || true

    # 新版 cargo-llvm-cov 接口要求分 3 步（收集/报告分开，参数归属严格区分）：
    # - 收集阶段：裸 cargo llvm-cov（不带 report 子命令）才接受 --workspace /
    #   --tests / --no-clean / --no-fail-fast 这类 test 相关参数
    # - 报告阶段：cargo llvm-cov report 负责输出格式（lcov / html）+ fail-under 校验，
    #   不接受 --workspace / --no-run 等属于 test 或 nextest 的参数。
    # - --ignore-filename-regex 两个阶段都可以加：test 阶段控制「哪些文件不
    #   instrument」，report 阶段控制「哪些文件不出现在最终报告」，保持一致更清晰。
    #
    # 关于 PR vs main 差异化：
    # - push 到 main：严格 fail-under-lines 45（红线）
    # - PR：同一份报告但 fail-under-lines 设 38（更低的警告阈值）
    - name: Run tests with coverage instrumentation
      run: |
        set -euo pipefail
        mkdir -p ./coverage
        cargo llvm-cov \
          --workspace \
          --tests \
          --no-clean \
          --no-fail-fast \
          --ignore-filename-regex "(tests/common/|/cargo/registry/|/rustc/|build.rs|target/)"

    - name: Generate coverage report (lcov + fail-under check)
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
          FAIL_UNDER=45
        else
          FAIL_UNDER=38
        fi
        echo "Using fail-under-lines=$FAIL_UNDER for event=${{ github.event_name }} ref=${{ github.ref }}"
        cargo llvm-cov report \
          --ignore-filename-regex "(tests/common/|/cargo/registry/|/rustc/|build.rs|target/)" \
          --lcov \
          --output-path ./coverage/lcov.info \
          --fail-under-lines "$FAIL_UNDER"

    - name: Generate coverage report (html artifact)
      run: |
        set -euo pipefail
        cargo llvm-cov report \
          --ignore-filename-regex "(tests/common/|/cargo/registry/|/rustc/|build.rs|target/)" \
          --html \
          --output-dir ./coverage

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats || true

    - name: Stop sccache server
      if: always()
      run: sccache --stop-server || true

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v5
      with:
        name: coverage-report
        path: ./coverage/
