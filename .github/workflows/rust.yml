name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install cargo-tools
      run: |
        cargo install --locked cargo-tarpaulin || true
        rustup component add clippy rustfmt

    - name: Cache ort-sys prebuilt binaries
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ort
        key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ort-sys-${{ runner.os }}-

    - name: Cache Cargo build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target/debug/.fingerprint
          target/debug/build
          target/debug/deps
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy check (deny warnings)
      run: cargo clippy --all-targets -- -D warnings

    - name: Check backend
      run: cargo check --lib --verbose

    - name: Install wasm32 target
      run: rustup target add wasm32-unknown-unknown

    - name: Check frontend
      run: cd frontend && cargo check --target wasm32-unknown-unknown --verbose

    - name: Run frontend tests
      run: cd frontend && cargo test --verbose

    - name: Build
      run: cargo build --verbose

    - name: Run unit tests (parallel)
      run: cargo test --lib --verbose

    - name: Run integration tests (serial)
      run: cargo test --test '*' --verbose -- --test-threads=1

    # Tarpaulin 主要支持 Linux，这里 runs-on 已是 ubuntu-latest。
    # 当前只收集覆盖率作为 baseline，不设门槛（--fail-under 0），
    # 待测试覆盖稳定后再逐步提高门槛。tarpaulin 失败不应阻断 CI（|| true）。
    - name: Generate coverage report
      run: |
        cargo tarpaulin --workspace --all-features --out Xml --out Html \
          --output-dir ./coverage \
          --exclude-files "tests/common/*" \
          --fail-under 0 \
          -- --lib || true

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage/
