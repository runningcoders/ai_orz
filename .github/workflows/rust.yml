name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  # sccache 与 incremental compilation 互斥，禁用 incremental 让 sccache 完全接管缓存
  # sccache 按内容寻址，相同 RUSTFLAGS 的编译结果跨 CI run 共享
  CARGO_INCREMENTAL: 0

jobs:
  # ===== 1. 格式检查（最快，独立 job，秒级返回）=====
  # 纯文本检查，不装 protoc/sccache，失败不阻塞后续更重的步骤
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install rustfmt
      run: rustup component add rustfmt

    - name: Format check
      run: cargo fmt --all -- --check

  # ===== 2. Clippy 门禁 =====
  # clippy --all-targets 会编译 lance build-script，需要 protoc
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    # libprotobuf-dev 提供 well-known types（google/protobuf/*.proto），
    # --no-install-recommends 下必须显式安装，否则 lance-encoding build script 报 empty.proto not found
    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    - name: Install clippy
      run: rustup component add clippy

    - name: Configure sccache (local disk mode)
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

    # 所有 job 共享同一个 sccache 缓存，按内容寻址跨 job 复用编译产物
    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Start sccache server
      run: sccache --start-server || true

    - name: Clippy check (deny warnings)
      run: cargo clippy --all-targets -- -D warnings

    # 文档链接规范门禁（AGENTS §2.1.2）：file:// 伪协议 / 绝对路径 / 冒号行号
    - name: Docs link lint
      run: cargo run -p ai-orz-tools --bin docs_lint

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats || true

    - name: Stop sccache server
      if: always()
      run: sccache --stop-server || true

  # ===== 3. Backend（lint 通过后跑，与 frontend 并行）=====
  # 单元测试 + 集成测试，sccache 命中 lint job 的依赖编译产物
  # 注：无独立 cargo build —— cargo test 会连同 bin target 一起编译（集成测试可调用 bin）
  backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v5

    # libprotobuf-dev 提供 well-known types（google/protobuf/*.proto），
    # --no-install-recommends 下必须显式安装，否则 lance-encoding build script 报 empty.proto not found
    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    - name: Configure sccache (local disk mode)
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

    - name: Cache ort-sys prebuilt binaries
      uses: actions/cache@v5
      with:
        path: ~/.cache/ort
        key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ort-sys-${{ runner.os }}-

    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Start sccache server
      run: sccache --start-server || true

    - name: Run unit tests (parallel)
      run: cargo test --lib --verbose

    - name: Run integration tests (parallel)
      run: cargo test --test '*' --verbose

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats || true

    - name: Stop sccache server
      if: always()
      run: sccache --stop-server || true

  # ===== 4. Frontend（lint 通过后跑，与 backend 并行）=====
  # wasm32 clippy + 前端测试，独立于 backend
  frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v5

    - name: Install wasm32 target and clippy
      run: rustup target add wasm32-unknown-unknown && rustup component add clippy

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    - name: Configure sccache (local disk mode)
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Start sccache server
      run: sccache --start-server || true

    # clippy 已包含完整类型检查，无需先跑一遍 cargo check
    - name: Clippy check (deny warnings)
      run: cd frontend && cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

    - name: Run frontend tests
      run: cd frontend && cargo test --verbose

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats || true

    - name: Stop sccache server
      if: always()
      run: sccache --stop-server || true

  # ===== 5. Coverage（lint 通过后与 backend/frontend 并行跑）=====
  # 时长优化：覆盖率不依赖 backend 测试结果，并行后移出关键路径
  # （原 lint→backend→coverage 串行链变为 lint→max(backend, coverage)）
  # sccache 命中其他 job 的依赖编译产物（非 instrument-coverage 部分），
  # 减少依赖库编译时间；instrument-coverage 部分仍需重编
  coverage:
    runs-on: ubuntu-latest
    needs: lint
    env:
      # 覆盖率红线差异化：push main = 45，PR = 38
      FAIL_UNDER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 45 || 38 }}
    steps:
    - uses: actions/checkout@v5

    # libprotobuf-dev 提供 well-known types（google/protobuf/*.proto），
    # --no-install-recommends 下必须显式安装，否则 lance-encoding build script 报 empty.proto not found
    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Configure sccache (local disk mode)
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

    - name: Cache ort-sys prebuilt binaries
      uses: actions/cache@v5
      with:
        path: ~/.cache/ort
        key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ort-sys-${{ runner.os }}-

    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Start sccache server
      run: sccache --start-server || true

    # 新版 cargo-llvm-cov 接口要求收集/报告分开（参数归属严格区分）：
    # - 收集阶段：裸 cargo llvm-cov（不带 report 子命令）才接受 --workspace /
    #   --tests / --no-clean / --no-fail-fast 这类 test 相关参数
    # - 报告阶段：cargo llvm-cov report 负责输出与 fail-under 校验，
    #   不接受 --workspace / --no-run 等属于 test 或 nextest 的参数。
    # - --ignore-filename-regex 两个阶段都可以加：test 阶段控制「哪些文件不
    #   instrument」，report 阶段控制「哪些文件不出现在最终报告」，保持一致更清晰。
    #
    # 报告策略：仅展示不产 artifact（文本表格进日志 + 摘要进 run Summary 页），
    # artifact 留给后续打 tag 的 release 二进制构建使用。
    #
    # 关于 PR vs main 差异化（FAIL_UNDER 见 job env）：
    # - push 到 main：严格 fail-under-lines 45（红线）
    # - PR：同一份报告但 fail-under-lines 设 38（更低的警告阈值）
    - name: Run tests with coverage instrumentation
      run: |
        set -euo pipefail
        cargo llvm-cov \
          --workspace \
          --tests \
          --no-clean \
          --no-fail-fast \
          --ignore-filename-regex "(tests/common/|/cargo/registry/|/rustc/|build.rs|target/)"

    # 门禁：文本报告（逐文件明细）直接输出到日志 + fail-under 校验
    - name: Coverage report (fail-under gate)
      run: |
        set -euo pipefail
        echo "Using fail-under-lines=$FAIL_UNDER for event=${{ github.event_name }} ref=${{ github.ref }}"
        cargo llvm-cov report \
          --ignore-filename-regex "(tests/common/|/cargo/registry/|/rustc/|build.rs|target/)" \
          --fail-under-lines "$FAIL_UNDER"

    # 展示：覆盖率摘要写入 run 的 Summary 页
    - name: Write coverage summary to run summary
      if: always()
      run: |
        {
          echo "## 📊 Coverage Report"
          echo ""
          echo "Threshold: fail-under-lines = **$FAIL_UNDER%** (event=${{ github.event_name }}, ref=${{ github.ref }})"
          echo ""
          echo '```'
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex "(tests/common/|/cargo/registry/|/rustc/|build.rs|target/)" 2>/dev/null \
            || echo "(coverage data unavailable)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Print sccache stats
      if: always()
      run: sccache --show-stats || true

    - name: Stop sccache server
      if: always()
      run: sccache --stop-server || true

  # ===== 6. E2E（已移出 CI，仅本地运行）=====
  # Playwright 浏览器端到端工程保留在 e2e/ 目录（cd e2e && npx playwright test），
  # 待前后端协议化改造（common DTO 全量复用）落地后再评估重新接入 CI。
