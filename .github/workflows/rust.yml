name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  # ===== 1. Lint 门禁（快，先跑）=====
  # fmt + clippy，不需要 protoc / 编译产物
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install rustfmt and clippy
      run: rustup component add rustfmt clippy

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy check (deny warnings)
      run: cargo clippy --all-targets -- -D warnings

  # ===== 2. Backend（lint 通过后跑）=====
  # check + build + 单元测试 + 集成测试
  backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4

    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Cache ort-sys prebuilt binaries
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ort
        key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ort-sys-${{ runner.os }}-

    - name: Cache Cargo build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target/debug/.fingerprint
          target/debug/build
          target/debug/deps
        key: cargo-backend-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-backend-${{ runner.os }}-

    - name: Check backend
      run: cargo check --lib --verbose

    - name: Build
      run: cargo build --verbose

    - name: Run unit tests (parallel)
      run: cargo test --lib --verbose

    - name: Run integration tests (parallel)
      run: cargo test --test '*' --verbose

  # ===== 3. Frontend（lint 通过后跑，与 backend 并行）=====
  # wasm32 check + 前端测试，独立于 backend
  frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4

    - name: Install wasm32 target
      run: rustup target add wasm32-unknown-unknown

    - name: Cache Cargo build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          frontend/target/wasm32-unknown-unknown/debug/.fingerprint
          frontend/target/wasm32-unknown-unknown/debug/build
          frontend/target/wasm32-unknown-unknown/debug/deps
          frontend/target/debug/.fingerprint
          frontend/target/debug/build
          frontend/target/debug/deps
        key: cargo-frontend-${{ runner.os }}-${{ hashFiles('frontend/Cargo.lock', 'Cargo.lock') }}
        restore-keys: |
          cargo-frontend-${{ runner.os }}-

    - name: Check frontend
      run: cd frontend && cargo check --target wasm32-unknown-unknown --verbose

    - name: Run frontend tests
      run: cd frontend && cargo test --verbose

  # ===== 4. Coverage（backend 通过后跑）=====
  # tarpaulin 覆盖率报告，最慢最易失败，放最后
  coverage:
    runs-on: ubuntu-latest
    needs: backend
    steps:
    - uses: actions/checkout@v4

    - name: Install protoc (for lancedb dependency)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install cargo-tarpaulin
      run: cargo install --locked cargo-tarpaulin || true

    - name: Cache ort-sys prebuilt binaries
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ort
        key: ort-sys-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ort-sys-${{ runner.os }}-

    - name: Cache Cargo build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target/debug/.fingerprint
          target/debug/build
          target/debug/deps
        key: cargo-coverage-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-coverage-${{ runner.os }}-

    # Tarpaulin 主要支持 Linux，这里 runs-on 已是 ubuntu-latest。
    # Baseline: 40.79% (6560/16083 lines, 2026-07-27 实测)
    # 门槛设为 35%，留 ~5% 缓冲避免小幅波动误报。
    # 未来随测试补充可逐步提高到 40% / 45%。
    - name: Generate coverage report
      run: |
        cargo tarpaulin --workspace --all-features --out Xml --out Html \
          --output-dir ./coverage \
          --exclude-files "tests/common/*" \
          --fail-under 35 \
          -- --lib

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage/
