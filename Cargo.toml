[workspace]
members = [
    ".",
    "frontend",
    "common",
    "ai-orz-macros",
]
resolver = "2"

[package]
name = "ai_orz"
version = "0.1.0"
edition = "2024"
autoexamples = false
autobenches = false

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-native-tls", "macros", "migrate", "uuid", "chrono"] }
toml = "1"
tower-http = { version = "0.6", features = ["fs"] }
rig-core = { version = "=0.34.0", features = ["all"] }
rmcp = { version = "1.7", default-features = false, features = ["client", "transport-child-process"] }
async-trait = "0.1"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "std"] }
sha256 = "1.1"
rand = "0.8"
tracing-appender = "0.2.4"
jsonwebtoken = "9.3"
cookie = "0.18"
uuid = { version = "1.23.0", features = ["v7", "serde"] }
dyn-clone = "1.0.14"
futures-util = "0.3.32"
common = { path = "./common", features = ["sqlx", "axum-integration", "bincode-integration", "rig-integration", "toml-integration", "reqwest-integration"] }
once_cell = "1.21.4"
thiserror = "1.0"
derive_builder = "0.20"
bincode = "2.0"
tempfile = "3.27"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing"] }
ctor = "0.2"
schemars = { version = "0.8", features = ["derive"] }
lazy_static = "1.4.0"
ai-orz-macros = { path = "./ai-orz-macros" }

# 向量搜索相关
fastembed = "5.13"  # 纯本地向量化（纯 Rust candle 后端，零系统依赖）
lancedb = "0.26"   # 嵌入式向量数据库
arrow-array = "57.3.0"
arrow-schema = "57.3.0"
futures = "0.3.32"

[features]
# 预留 feature flags - 暂不启用，直接默认启用纯 Rust InMemoryVectorStore
# hnsw = ["dep:hnsw"]
# full-vector = ["hnsw"]