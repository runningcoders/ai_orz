[workspace]
members = [
    ".",
    "frontend",
    "common",
    "ai-orz-macros",
    "tools",
]
resolver = "2"

[package]
name = "ai_orz"
version = "0.1.0"
edition = "2024"
autoexamples = false
autobenches = false

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-native-tls", "macros", "migrate", "uuid", "chrono"] }
toml = "1"
tower-http = { version = "0.6", features = ["fs"] }
tower-service = "0.3"  # Service trait（router SPA 回退自定义服务用）
rmcp = { version = "1.7", default-features = false, features = ["client", "transport-child-process"] }
async-trait = "0.1"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "std"] }
sha256 = "1.1"
rand = "0.8"
tracing-appender = "0.2.4"
jsonwebtoken = "9.3"
cookie = "0.18"
uuid = { version = "1.23.0", features = ["v4", "v7", "serde"] }
dyn-clone = "1.0.14"
futures-util = "0.3.32"
tokio-stream = { version = "0.1", features = ["sync"] }
common = { path = "./common", features = ["sqlx", "axum-integration", "bincode-integration", "toml-integration", "reqwest-integration", "tokio-integration"] }
once_cell = "1.21.4"
thiserror = "1.0"
derive_builder = "0.20"
bincode = "2.0"
tempfile = "3.27"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing"] }
ctor = "0.2"
duckdb = { version = "1.4.0", features = ["bundled"] }
schemars = { version = "0.8", features = ["derive"] }
lazy_static = "1.4.0"
ai-orz-macros = { path = "./ai-orz-macros" }
dashmap = "6.1"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

# 备份相关
tar = "0.4"
flate2 = "1.0"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

# 敏感数据加密（渠道凭证落库）
aes-gcm = "0.10"
base64 = "0.22"

# 向量搜索相关
# 禁用 default-features 中的 image-models（避免拉入 image → exr → pulp 0.22.3 的 x86 const eval bug）
fastembed = { version = "5.13", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }  # 纯本地向量化（纯 Rust candle 后端，零系统依赖）
lancedb = "0.26"   # 嵌入式向量数据库
instant-distance = "0.6.1"  # 纯 Rust HNSW 索引（零系统依赖）
arrow-array = "57.3.0"
arrow-schema = "57.3.0"
futures = "0.3.32"

# 定时任务 cron 表达式解析
cron = "0.15"
chrono-tz = "0.10"

# 进程管理原语（Unix 下探活/终止子进程）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
dotenvy = "0.15"
common = { path = "./common", features = ["sqlx", "axum-integration", "bincode-integration", "toml-integration", "reqwest-integration", "tokio-integration"] }
http-body-util = "0.1"
tokio-stream = "0.1"

