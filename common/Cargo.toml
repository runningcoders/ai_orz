[package]
name = "common"
version = "0.1.0"
edition = "2024"

# Common types shared between backend and frontend
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
schemars = { version = "0.8", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["macros"], default-features = false, optional = true }

