# ai_orz 配置文件
#
# 这个文件在程序首次运行时会从二进制嵌入解压生成
# 你可以修改这里的配置来自定义程序行为
#
# 环境变量会覆盖这里的配置
# 基础数据目录固定为 .ai_orz/，不需要配置

# 服务器配置
[server]
# 监听地址
listen_addr = "0.0.0.0:3000"
# 系统时区（IANA 时区名，用于 cron 表达式解析等时间相关功能）
timezone = "Asia/Shanghai"

# 数据库配置
[database]
# SQLite 数据库文件名（相对于 .ai_orz/）
db_file_name = "ai_orz.db"

# 前端配置
[frontend]
# 静态文件目录
dist_dir = "dist"

# 日志配置
[logging]
# 是否启用文件日志
enable_file_log = true
# 日志文件目录（相对于 .ai_orz/）
log_subdir = "logs"

# A2A 协议配置
[a2a_server]
# 是否启用 A2A Server（JSON-RPC 端点）
enabled = true

# Tavily 网络搜索配置（tavily_search 工具）
[tavily]
# 共享 API key（实例级兜底；个人 key 优先走用户身份凭证库，两者皆缺时工具调用返回引导）
# api_key = "tvly-xxx"
# 请求超时（毫秒）
timeout_ms = 15000

# 浏览器自动化配置（browser 内置工具，包装 agent-browser CLI）
[browser]
# agent-browser 二进制名或绝对路径（绝对路径优先；未安装时工具调用返回安装引导）
command = "agent-browser"
# 单次子命令超时（毫秒）
timeout_ms = 60000
# 输出截断上限（字节）
max_output_bytes = 262144

# JWT配置
[jwt]
# JWT签名密钥（生产环境务必修改！也可以通过环境变量 JWT_SECRET 设置
# secret = "your-secret-key-here"
# JWT默认过期时间（小时），默认 7 天（168小时），也可以通过环境变量 JWT_EXPIRY_HOURS 设置
# default_expiry_hours = 168

# 安全配置
[security]
# 数据库敏感字段（渠道凭证等）的主加密密钥，不可为空，生产环境务必修改！
secret_key = "ai-orz-default-secret-key-change-me"

# Agent 运行时配置（系统级默认值，可被单个 Agent 的 runtime_config 覆盖）
[agent]
# 单次唤醒最大思考轮次（跨压缩累计）
max_thinking_rounds = 365
# 意图识别阶段最大思考轮次
intent_analyze_max_rounds = 365
# 总结退出阶段最大思考轮次
summary_max_rounds = 365
# 思考超时（秒），0 = 不限制
think_timeout_secs = 0

# 工具运行日志配置（shell_exec 等工具的运行时输出清理策略）
[tool_log]
# 工具日志保留天数（0 = 不清理），超期日志由系统定时任务自动清理（运行中进程的日志受保护不删）
retention_days = 30

