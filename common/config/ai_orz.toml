# ai_orz 配置文件
#
# 这个文件在程序首次运行时会从二进制嵌入解压生成
# 你可以修改这里的配置来自定义程序行为
#
# 环境变量会覆盖这里的配置
# 基础数据目录固定为 .ai_orz/，不需要配置

# 服务器配置
[server]
# 监听地址
listen_addr = "0.0.0.0:3000"
# 监听地址也可用环境变量 AI_ORZ_LISTEN_ADDR 覆盖（如 AI_ORZ_LISTEN_ADDR=0.0.0.0:8080，首次初始化会固化）
# 对外可达的联邦通信基址：容器/反代部署必填（填网关域名），否则联邦 peer 拿到的是容器内网地址。
# 也可用环境变量 AI_ORZ_PUBLIC_BASE_URL 覆盖。
# public_base_url = "https://orz.example.com"
# 系统时区（IANA 时区名，用于 cron 表达式解析等时间相关功能）
timezone = "Asia/Shanghai"
# 是否部署在反向代理（网关）之后：开启后才信任 X-Forwarded-For / X-Forwarded-Proto。
# 关闭（默认）时忽略这两个头（直连场景客户端可伪造）；放在 Caddy / Nginx 后面必须开启，
# 否则日志里的客户端 IP 全是网关 IP。也可用环境变量 AI_ORZ_TRUST_PROXY 覆盖。
trust_proxy = false
# 登录 Cookie 的 Secure 标记：true 强制加、false 强制不加、不配置（注释掉）时
# 在 trust_proxy 开启且 X-Forwarded-Proto 为 https 时自动加。
# 也可用环境变量 AI_ORZ_COOKIE_SECURE=true|false 覆盖。
# cookie_secure = true

# 数据库配置
[database]
# SQLite 数据库文件名（相对于 .ai_orz/）
db_file_name = "ai_orz.db"

# 前端配置
[frontend]
# 静态文件目录
dist_dir = "dist"

# 日志配置
[logging]
# 是否启用文件日志
enable_file_log = true
# 日志文件目录（相对于 .ai_orz/）
log_subdir = "logs"

# A2A 协议配置
[a2a_server]
# 是否启用 A2A Server（JSON-RPC 端点）
enabled = true

# JWT配置
[jwt]
# JWT签名密钥（生产环境务必修改！也可以通过环境变量 JWT_SECRET 设置
# secret = "your-secret-key-here"
# JWT默认过期时间（小时），默认 7 天（168小时），也可以通过环境变量 JWT_EXPIRY_HOURS 设置
# default_expiry_hours = 168

# 安全配置
[security]
# 数据库敏感字段（渠道凭证等）的主加密密钥，不可为空，生产环境务必修改！
# 也可用环境变量 SECRET_KEY 覆盖（首次初始化会固化）
secret_key = "ai-orz-default-secret-key-change-me"

# Agent 运行时配置（系统级默认值，可被单个 Agent 的 runtime_config 覆盖）
#
# 预算分三层，不要混用：
#   ① 唤醒级（跨压缩 / 跨周期累计）：max_thinking_rounds / think_timeout_secs / token_budget
#      —— 一次唤醒内所有思考周期**共享**一份，前面多用后面就少用。
#   ② 场景级（固定小预算，独立于①）：intent_analyze_max_rounds / summary_max_rounds
#      —— 意图识别、轮次耗尽后的收尾总结，各自只给几轮。
#   ③ 任务级：max_thinking_depth（单任务内最多唤醒几次，在 Agent runtime_config 里）
[agent]
# 单次唤醒的思考总轮次（跨压缩累计；不是每个周期各一份）
max_thinking_rounds = 365
# 意图识别阶段轮次（场景级；通常 1 轮出结构化结果，3 轮是容错）
intent_analyze_max_rounds = 3
# 轮次耗尽后「收尾总结」的轮次（场景级；产物会作为最终回复发给用户）
summary_max_rounds = 3
# 单次唤醒思考超时（秒，跨周期累计），0 = 不限制
think_timeout_secs = 0
# 单次唤醒 Token 预算（input+output 累计，跨周期），0 = 不启用
token_budget = 0
# 记忆分流阈值：本轮问答估算 token 数（中文≈汉字数，英文≈4 字符/token）
# 低于它原文写入短期记忆，达到/超过才交给模型压缩
compaction_threshold_tokens = 256

# 工具运行日志配置（shell_exec 等工具的运行时输出清理策略）
[tool_log]
# 工具日志保留天数（0 = 不清理），超期日志由系统定时任务自动清理（运行中进程的日志受保护不删）
retention_days = 30

# 项目跟进巡检配置（系统定时 project_followup 触发器）
[project_followup]
# 停滞阈值（秒）：项目与其任务最近一次活动距今 ≥ 该值才视为「数据层面停滞」，触发跟进
stall_threshold_seconds = 7200
# 最小跟进间隔（秒）：距上次跟进不足该间隔则跳过（同项目最短 6 小时跟进一次）
min_followup_interval_seconds = 21600

# 说明：Shell 子进程的环境配置（PATH 补全 path_additions / HOME 策略 home_mode）
# 属于**工具级配置**，放在 shell_exec 工具的 PO config 中（与其 additional_allowed_paths 同级），
# 不在此全局配置文件里；未配置时使用内置默认值。

