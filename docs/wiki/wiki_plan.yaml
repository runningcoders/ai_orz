# ⚠️ 本文件原来的 repowiki 生成链路已下线（Qoder IDE 插件，2026-11 起不可用）。
# docs/wiki/ 现为**团队手工增量维护**，本文件不再是「生成配置」，降级为两份约定：
#   1) scope.exclude —— 哪些内容不进 wiki（构建产物 / 机器缓存 / 第三方补丁）
#   2) notes        —— 架构叙事基线（写 wiki 页面或让 Agent 生成内容时须遵守的口径）
# 索引与门禁见 tools/wiki_index.py（make wiki-index 重建 / make wiki-lint 校验）。
version: 1

scope:
  include: []
  exclude:
    # sqlx 离线查询缓存（机器生成的 JSON，无文档价值）
    - ".sqlx/**"
    # 构建产物与运行时数据
    - "target/**"
    - "dist/**"
    - "frontend/dist/**"
    - "frontend/pkg/**"
    - "frontend/target/**"
    - "frontend/node_modules/**"
    - "frontend/public/output.css"
    - ".ai_orz/**"
    # 第三方依赖补丁源码（非本项目代码）
    - "patches/**"
    - "build_rs_cov.profraw"

repowiki:
  template: architecture
  notes:
    - text: >-
        本项目是全栈 Rust 多 Agent 协作框架，严格四层单向调用：
        Adapter（HTTP Handler / 公开回调 Handler / AOP Producer）→ Domain → DAL → DAO，
        禁止跨层调用与同层互调；描述任何模块时必须明确其所属层级与调用方向。
    - text: >-
        PO 持久化对象仅在 DAO/DAL 层内部使用，绝不暴露到 Domain 层及以上；
        Domain 层输入为 Command/Query，输出为业务实体（内部持有 po 字段）与内部事件；
        DAL 对外接口统一使用业务实体，不用 PO。
    - text: >-
        service 层（DAO/DAL/Domain）所有公共方法的第一个参数必须是 ctx: RequestContext，
        跨层传递统一使用 ctx.clone()；命名遵循 snake_case，Trait 不加 Trait 后缀，
        实现类加 Impl 后缀（如 AgentDaoSqliteImpl）。
    - text: >-
        通用基础设施工具统一放在 src/pkg/ 对应子模块（aop/adapter/stats/logging/storage 等），
        pkg 层必须无业务感知；禁止在业务 DAO 中定义通用工具函数造成 DAO → DAO 依赖。
    - text: >-
        启动流程为两阶段初始化：同步 service::init() 注册单例与 AOP producer/consumer，
        异步 service::init_base_data() 幂等注入 DB 默认基础数据（agent_rest 每 4h、
        project_followup 每 1h 两条系统级 cron triggers）；每个 Domain 实现自己的
        init_base_data 扩展点。
    - text: >-
        技术栈版本钉死：后端 Axum 0.8 + sqlx 0.8（SQLite，.sqlx 离线查询缓存）+ DuckDB 统计；
        前端 Dioxus 0.7（WASM）+ Tailwind CSS v4 + DaisyUI v5；向量搜索 LanceDB 0.26 默认，
        支持 HNSW/InMemory/SqliteVss 多后端降级；全文搜索使用 FTS5 + trigram 分词器。
    - text: >-
        docs/ 目录是规范事实来源：AGENTS.md 为开发规范总览，
        docs/LAYERED_ARCHITECTURE_PRACTICE.md 含 7 个架构实践与反模式清单，
        docs/ARCHITECTURE.md 为最新架构说明；wiki 描述与这些文档冲突时以 docs/ 为准。
    - text: >-
        质量门槛：clippy -D warnings 零容忍（后端 + 前端 wasm32），
        cargo-llvm-cov 覆盖率门槛 PR 38% / main 45%，
        集成测试位于 tests/integration/（33 个，覆盖 Auth/CRUD/消息投递/向量降级/A2A/预置技能/Cron）。
    - text: >-
        本体（ontology）是知识图谱的 TBox，不是某个业务域的内部细节：受控词表（实体类 / 关系类型 /
        同义映射）、属性定义（data_type / value_range / cardinality / domain_classes）、骨架三元组
        （class -[relation]-> class，含继承链）三层；写侧在属性写入链路设 0→1→1.5→2+3→4 五道门闩
        （只有类型错与基数冲突硬拒，其余软记账后照写），读侧提供漂移看板（词频 / 关系覆盖率 /
        属性域覆盖率，阈值 0.95）与属性有效性（众数占比 >0.90 标黄）。它横跨 Adapter → Domain →
        DAL → DAO + common 契约 + 前端，描述架构时须单列子系统。
    - text: >-
        思维轨迹（think_trace）是 Runtime 的一等产物：思考循环每轮向
        agents/{agent_id}/think_trace/{YYYYMMDD}.jsonl 追加一行（与记忆 JSONL 共用 DailyJsonlWriter
        但目录独立、生命周期独立），查询侧 query_think_traces 按 agent 分页读回，前端以「轮次时间线 +
        思考图 + 轨迹面板」三处消费；思考编排由 pkg/think_path 图引擎承担（七相位 Stimulus / Reflex /
        Triage / Prepare / Deliberate / Consolidate / Review，十分区 ContextKey）。相位只做契约模板与
        可视化分组，不构成执行顺序。
    - text: >-
        认知架构是分层的，不是一次模型调用：Cortex（dao/cortex）负责慢思考与工具调用；Cerebellum
        （dao/cerebellum，System One）在首轮前做亚秒级快判断（800ms 超时、置信度 0.85 阈值、三层降级
        一律静默跳过）；反射弧（think_path 的 Reflex 相位）靠零 I/O 短路处理琐碎刺激；Brain 是容器
        （model provider + 小脑 provider + 记忆列表）。描述 Agent Runtime 时必须体现这三层分工。

knowledgecard:
  notes:
    - text: >-
        模块划分严格对齐四层架构：src/handlers（适配层用户 API + 外部回调）、
        src/producer（适配层轮询 + 外部 WS 事件接入）、src/consumer（内部事件消费）、
        src/service/domain（业务编排）、src/service/dal（PO↔Entity 转换）、
        src/service/dao（本地 DB CRUD + 外部 API 出站）、src/pkg（业务无感知基础设施）、
        src/models（PO + 业务实体 + 内部事件）；DAO 不调 DAO、DAL 不调 DAL、Domain 不调 Domain。
    - text: >-
        前端为 Dioxus 0.7 WASM 应用（frontend/src 下 api/components/hooks/layouts/pages/store/utils），
        通过 common crate 与后端共享 API DTO/枚举/错误类型，Tailwind CSS v4 + DaisyUI v5；
        common 与 ai-orz-macros 是独立 workspace 成员，不依赖后端 service 代码。
    - text: >-
        ai-orz-macros 提供统一 IDL 宏：#[generate_http_handler] + #[derive(Params)] +
        #[param(source = "path/query")]，一份结构体定义同时生成 HTTP handler 与 LLM 工具调用参数，
        属于横切后端适配层的核心基础设施，应作为独立模块卡片描述。
