[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[build-dependencies]
common = { path = "../common" }
toml = "0.8"
serde_json = "1.0"

# wasm32-unknown-unknown 构建门禁修复：dioxus 默认 devtools → tungstenite → rand 0.9
# → getrandom 0.3.4 在 wasm32-unknown-unknown 默认不受支持，需启用其 `wasm_js` feature
# （该 feature 仅引入 wasm-bindgen/js-sys，二者 frontend 已直接依赖，无锁膨胀）。
# 经 feature 统一，同一 wasm 构建内的所有 getrandom 0.3.4（含 rand 传递引入）一并生效；
# 宿主/服务端构建不受影响。
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dependencies]
dioxus = { version = "0.7.10", features = ["web", "router"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3.103", features = ["Window", "Performance", "Storage", "EventSource", "MessageEvent", "Event", "Request", "RequestInit", "RequestCredentials", "Response", "FormData", "HtmlInputElement", "FileList", "File", "Blob", "BlobPropertyBag", "HtmlElement", "Navigator", "Clipboard", "MediaQueryList", "MediaQueryListEvent", "HtmlCanvasElement", "CanvasRenderingContext2d", "CanvasGradient", "Element", "DomRect", "TextMetrics"] }
wasm-bindgen = "0.2"
tracing = "0.1"
common = { path = "../common" }
futures-channel = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
chrono = "0.4"
js-sys = "0.3"
pulldown-cmark = "0.13"
